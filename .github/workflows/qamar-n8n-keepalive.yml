name: Qamar n8n Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Qamar n8n
        run: |
          curl -fsS --max-time 60 --retry 3 --retry-delay 5 https://qamar-render-deployment.onrender.com/ > /dev/null
          echo "Qamar n8n keep-alive ping completed"
