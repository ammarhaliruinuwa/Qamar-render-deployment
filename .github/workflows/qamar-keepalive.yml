name: Qamar n8n Keep Alive

on:
  schedule:
    # GitHub Actions schedules use UTC. Runs every 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Qamar n8n on Render
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 5 \
            https://qamar-render-deployment-1.onrender.com/
          echo "Qamar n8n ping successful"
